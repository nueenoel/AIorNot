<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/static/aiornot-logo-256.png">
  <title>AIorNot</title>
  <style>
    :root{--bg:#fff;--text:#111;--muted:#777;--line:#ddd;--soft:#f6f6f6;--dark:#111}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

    .menu-btn{
      position:fixed;top:22px;left:22px;width:38px;height:38px;
      border:1px solid var(--line);background:#fff;border-radius:10px;
      display:grid;place-content:center;gap:4px;cursor:pointer;z-index:20
    }
    .menu-btn span{display:block;width:15px;height:1.5px;background:#111}

    .side-panel{
      position:fixed;inset:0 auto 0 0;width:min(330px,88vw);
      padding:78px 28px 30px;background:#fff;border-right:1px solid var(--line);
      transform:translateX(-100%);transition:transform .2s ease;z-index:15
    }
    .side-panel.open{transform:translateX(0)}
    .side-panel h2{margin:0 0 22px;font-size:22px}
    .side-panel .next-title{margin-top:34px}
    .side-panel p{max-width:100%;} 
    .side-panel p{
      display:grid;
      grid-template-columns:22px minmax(0,1fr);
      align-items:start;
      column-gap:0;
      margin:0 0 15px;
      color:#555;
      line-height:1.55;
      font-size:14px;
    }
    .side-panel p::before{
      content:'•';
      width:22px;
      height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#111;
      font-size:16px;
      line-height:1;
    }
    .close-btn{
      position:absolute;top:20px;right:20px;border:0;background:transparent;
      font-size:26px;cursor:pointer
    }

    .page{
      min-height:100vh;display:flex;flex-direction:column;align-items:center;
      padding:90px 22px 60px;
      transition:transform .28s ease
    }
    .hero{text-align:center;max-width:720px}
    .hero h1{
      font-size:clamp(56px,10vw,92px);line-height:1;margin:0;font-weight:800;
      letter-spacing:-.06em
    }
    .hero p{margin:18px 0 0;font-size:20px;color:#555}

    .analyzer{width:min(760px,100%);margin-top:64px}

    /* Desktop keeps the original horizontal layout. */
    .upload-area{
      display:grid;
      grid-template-columns:auto minmax(34px,70px) auto;
      align-items:center;
      justify-content:center;
      column-gap:18px;
      width:100%;
    }

    .upload-btn,.analyze-btn{
      height:48px;padding:0 20px;border-radius:10px;border:1px solid #111;
      font:inherit;font-weight:650;cursor:pointer
    }
    .upload-btn{background:#111;color:#fff}
    .analyze-btn{background:#fff;color:#111}
    .analyze-btn:disabled{opacity:.4;cursor:default}

    .arrow{
      color:#999;font-size:24px;white-space:nowrap;
      text-align:center;line-height:1;display:flex;
      align-items:center;justify-content:center
    }
    .arrow-dots{letter-spacing:2px}
    .arrow-symbol{margin-left:2px}

    .file-name{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:18px 0 0;
      color:#555;
      font-size:14px;
      min-height:40px;
      word-break:break-word
    }

    .file-icon{
      width:14px;
      height:14px;
      flex:0 0 14px;
      display:block;
      border:1px solid #999;
      background:repeating-linear-gradient(
        45deg,
        transparent 0,
        transparent 2px,
        #999 2px,
        #999 3px
      );
    }

    /* Compact Drive-style selected-file card. */
    .preview{
      width:80%;
      margin:22px auto 0;
      display:none;
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      background:#fff
    }
    .preview-meta{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:58px;
      padding:9px 12px;
      color:#666;
      font-size:13px;
    }
    .preview-meta img{
      display:block;
      width:40px;
      height:40px;
      object-fit:cover;
      border-radius:6px;
      background:var(--soft);
      flex:0 0 40px;
    }
    .preview-filename{
      flex:1;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap
    }
    .preview-kind{
      font-size:12px;
      color:#999
    }

    .status{text-align:center;margin-top:20px;color:#666;font-size:13px;min-height:20px}

    .result{
      margin-top:38px;padding-top:32px;border-top:1px solid var(--line);
      text-align:center
    }
    .result-label{font-size:30px;font-weight:750;letter-spacing:-.03em}
    .score{margin-top:10px;font-size:20px;color:#555}
    .coming{color:#555}

    @media(min-width:601px){
      .page.guide-open{
        transform:translateX(165px);
      }
    }

    @media(max-width:600px){
      .page{padding:105px 16px 60px}
      .analyzer{margin-top:46px}

      /* Keep Choose file, arrow, and Analyze on one aligned row. */
      .upload-area{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:10px;
      }

      .upload-btn,.analyze-btn{
        width:auto;
        min-width:185px;
        padding:0 20px
      }

      .arrow{
        font-size:20px;
        height:22px;
        flex-direction:column;
      }

      /* On phones, use only a centered downward arrow. */
      .arrow-dots{
        display:none;
      }

      .arrow-symbol{
        display:block;
        margin:0;
        line-height:1;
        transform:rotate(90deg);
      }

      .file-name{
        justify-content:center;
        text-align:center;
        width:100%;
        font-size:13px;
      }

      .preview{margin:18px auto 0}
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>

  <aside class="side-panel" id="sidePanel" aria-hidden="true">
    <button class="close-btn" id="closeBtn" aria-label="Close menu">×</button>
    <h2>How it works?</h2>
    <p>Upload an image.</p>
    <p>AIorNot analyzes it with an image classification model.</p>
    <p>It estimates whether the image is likely real or synthetic.</p>

    <h2 class="next-title">What’s next?</h2>
    <p>Video and audio analysis are being added.</p>
  </aside>

  <main class="page">
    <section class="hero">
      <h1>AIorNot</h1>
      <p>Real or rendered? Let’s see.</p>
    </section>

    <section class="analyzer">
      <input
        id="fileInput"
        type="file"
        hidden
        accept=".jpg,.jpeg,.png,.webp,.mp4,.mov,.avi,.mkv,.webm,.mp3,.wav"
      >

      <div class="upload-area">
        <button class="upload-btn" id="uploadBtn" type="button">Choose file</button>
        <div class="arrow" aria-hidden="true"><span class="arrow-dots">····</span><span class="arrow-symbol">→</span></div>
        <button class="analyze-btn" id="analyzeBtn" type="button" disabled>Analyze</button>
      </div>

      <div class="file-name" id="fileName">No file selected</div>

      <div class="preview" id="preview"></div>

      <div class="status" id="status"></div>

      <div class="result" id="result" hidden>
        <div class="result-label" id="resultLabel"></div>
        <div class="score" id="resultScore"></div>
      </div>
    </section>
  </main>

  <script>
    const fileInput=document.getElementById('fileInput');
    const uploadBtn=document.getElementById('uploadBtn');
    const analyzeBtn=document.getElementById('analyzeBtn');
    const fileName=document.getElementById('fileName');
    const preview=document.getElementById('preview');
    const statusEl=document.getElementById('status');
    const result=document.getElementById('result');
    const resultLabel=document.getElementById('resultLabel');
    const resultScore=document.getElementById('resultScore');
    const menuBtn=document.getElementById('menuBtn');
    const sidePanel=document.getElementById('sidePanel');
    const closeBtn=document.getElementById('closeBtn');
    const page=document.querySelector('.page');

    let uploaded=null;

    menuBtn.onclick=()=>{
      sidePanel.classList.add('open');
      sidePanel.setAttribute('aria-hidden','false');
      page.classList.add('guide-open');
    };

    closeBtn.onclick=()=>{
      sidePanel.classList.remove('open');
      sidePanel.setAttribute('aria-hidden','true');
      page.classList.remove('guide-open');
    };

    uploadBtn.onclick=()=>fileInput.click();
    fileInput.onchange=()=>chooseFile(fileInput.files[0]);

    function fmt(bytes){
      if(bytes<1024)return bytes+' B';
      if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
      return (bytes/1024/1024).toFixed(1)+' MB';
    }

    function ext(name){
      return name.includes('.')?name.split('.').pop().toLowerCase():'';
    }

    function setFileName(name,size){
      fileName.innerHTML='';

      const icon=document.createElement('span');
      icon.className='file-icon';
      icon.setAttribute('aria-hidden','true');

      const label=document.createElement('span');
      label.textContent=name+' • '+fmt(size);
      label.style.cssText=
        'min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';

      fileName.append(icon,label);
    }

    function chooseFile(file){
      if(!file)return;

      uploaded=null;
      analyzeBtn.disabled=true;
      result.hidden=true;
      statusEl.textContent='';

      const e=ext(file.name);

      preview.style.display='none';
      preview.innerHTML='';

      setFileName(file.name,file.size);

      if(['jpg','jpeg','png','webp'].includes(e)){
        const img=document.createElement('img');
        img.src=URL.createObjectURL(file);
        img.alt='Uploaded image thumbnail';

        const meta=document.createElement('div');
        meta.className='preview-meta';

        const filename=document.createElement('span');
        filename.className='preview-filename';
        filename.textContent=file.name;

        const kind=document.createElement('span');
        kind.className='preview-kind';
        kind.textContent='Image';

        meta.append(img,filename,kind);
        preview.append(meta);
        preview.style.display='block';
      }

      upload(file);
    }

    async function upload(file){
      statusEl.textContent='Uploading…';

      const fd=new FormData();
      fd.append('media',file);

      try{
        const r=await fetch('/api/upload',{
          method:'POST',
          body:fd
        });

        const d=await r.json();

        if(!r.ok)throw new Error(d.error||'Upload failed.');

        uploaded=d;
        setFileName(d.filename,d.size);

        if(d.kind==='image'){
          analyzeBtn.disabled=false;
          statusEl.textContent='Ready to analyze.';
        }else{
          analyzeBtn.disabled=true;
          statusEl.textContent=
            'Analysis coming soon — image analysis is available now; video/audio analysis is being added.';
        }
      }catch(err){
        statusEl.textContent=err.message;
      }
    }

    analyzeBtn.onclick=async()=>{
      if(!uploaded)return;

      analyzeBtn.disabled=true;
      fileInput.disabled=true;
      statusEl.textContent='Analyzing…';

      result.hidden=false;
      resultLabel.textContent='';
      resultScore.textContent='';

      const fd=new FormData();
      fd.append('stored_name',uploaded.stored_name);
      fd.append('filename',uploaded.filename);

      try{
        const r=await fetch('/api/analyze',{
          method:'POST',
          body:fd
        });

        const d=await r.json();

        if(!r.ok)throw new Error(d.error||'Analysis failed.');

        resultLabel.textContent=d.label||'Result';
        resultScore.textContent=
          d.score==null?'':(d.score+'% confidence');
        statusEl.textContent='';
      }catch(err){
        resultLabel.textContent='Analysis unavailable';
        statusEl.textContent=err.message;
      }finally{
        analyzeBtn.disabled=false;
        fileInput.disabled=false;
      }
    };
  </script>
</body>
</html>
