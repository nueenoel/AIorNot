<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/aiornot-logo-256.png">
  <link rel="shortcut icon" href="/static/aiornot-logo-256.png">
  <link rel="apple-touch-icon" href="/static/aiornot-logo-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <title>AIorNot</title>
  <style>
    :root{
      --paper:#fafaf8;
      --surface:#ffffff;
      --ink:#171716;
      --muted:#6e6d69;
      --muted-strong:#4f4e4b;
      --line:rgba(23,23,22,.13);
      --line-strong:rgba(23,23,22,.28);
      --soft:#f1f1ed;
      --accent:#eb5b38;
      --accent-soft:#fff0eb;
      --real:#26765f;
      --real-soft:#edf8f3;
      --uncertain:#9a681a;
      --uncertain-soft:#fff7e9;
      --shadow:0 14px 38px rgba(23,23,22,.08), 0 2px 7px rgba(23,23,22,.05);
    }

    *{box-sizing:border-box}

    html{background:var(--paper)}

    body{
      min-width:320px;
      margin:0;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 50% -16%, rgba(235,91,56,.055), transparent 34rem),
        var(--paper);
      color:var(--ink);
      font-family:"Manrope",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-feature-settings:"kern" 1,"liga" 1,"tnum" 1;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,input{font:inherit}

    button{touch-action:manipulation}

    button:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:3px;
    }

    .menu-btn{
      position:fixed;
      top:20px;
      left:20px;
      z-index:30;
      display:grid;
      width:42px;
      height:42px;
      place-content:center;
      gap:4px;
      padding:0;
      border:1px solid var(--line);
      border-radius:11px;
      background:rgba(255,255,255,.92);
      box-shadow:0 2px 9px rgba(23,23,22,.045);
      cursor:pointer;
      transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
      backdrop-filter:blur(8px);
    }

    .menu-btn:hover{
      border-color:var(--line-strong);
      box-shadow:0 5px 15px rgba(23,23,22,.09);
      transform:translateY(-1px);
    }

    .menu-btn:active{transform:translateY(0)}

    .menu-btn span{
      display:block;
      width:16px;
      height:1.5px;
      border-radius:10px;
      background:var(--ink);
      transition:transform .2s ease,opacity .2s ease;
    }

    body.menu-open .menu-btn span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
    body.menu-open .menu-btn span:nth-child(2){opacity:0}
    body.menu-open .menu-btn span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}

    .menu-scrim{
      position:fixed;
      z-index:19;
      inset:0;
      visibility:hidden;
      background:rgba(23,23,22,.22);
      opacity:0;
      transition:opacity .22s ease,visibility .22s ease;
    }

    body.menu-open .menu-scrim{
      visibility:visible;
      opacity:1;
    }

    .side-panel{
      position:fixed;
      z-index:25;
      inset:0 auto 0 0;
      width:min(344px,88vw);
      padding:88px 30px 32px;
      overflow-y:auto;
      border-right:1px solid var(--line);
      background:rgba(255,255,255,.98);
      box-shadow:18px 0 46px rgba(23,23,22,.12);
      transform:translateX(-104%);
      transition:transform .26s cubic-bezier(.2,.72,.22,1);
      -webkit-backdrop-filter:blur(16px);
      backdrop-filter:blur(16px);
    }

    .side-panel.open{transform:translateX(0)}

    .side-panel h2{
      margin:0 0 19px;
      color:var(--ink);
      font-family:"Space Grotesk",sans-serif;
      font-size:20px;
      font-weight:600;
      letter-spacing:-.045em;
    }

    .side-panel .next-title{margin-top:39px}

    .side-panel p{
      position:relative;
      display:block;
      margin:0 0 14px;
      padding-left:24px;
      color:var(--muted-strong);
      font-size:13px;
      line-height:1.65;
    }

    .side-panel p::before{
      position:absolute;
      top:.83em;
      left:0;
      content:"";
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--accent);
      transform:translateY(-50%);
    }

    .page{
      display:flex;
      min-height:100vh;
      flex-direction:column;
      align-items:center;
      padding:54px 22px 30px;
      transition:transform .3s cubic-bezier(.2,.72,.22,1);
    }

    .hero{
      max-width:720px;
      text-align:center;
    }

    .hero h1{
      margin:0;
      color:var(--ink);
      font-family:"Space Grotesk","Manrope",sans-serif;
      font-size:clamp(56px,10vw,92px);
      font-weight:600;
      letter-spacing:-.085em;
      line-height:.93;
    }

    .hero p{
      margin:21px 0 0;
      color:var(--muted-strong);
      font-size:clamp(16px,2.25vw,19px);
      font-weight:500;
      letter-spacing:-.025em;
      line-height:1.45;
    }

    .analyzer{
      width:min(760px,100%);
      margin-top:67px;
    }

    .upload-area{
      display:grid;
      grid-template-columns:auto minmax(50px,76px) auto;
      align-items:center;
      justify-content:center;
      width:100%;
      column-gap:16px;
    }

    .upload-btn,.analyze-btn{
      height:50px;
      padding:0 21px;
      border-radius:9px;
      font-size:14px;
      font-weight:700;
      letter-spacing:-.02em;
      cursor:pointer;
      transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,transform .18s ease;
    }

    .upload-btn{
      border:1px solid var(--ink);
      background:var(--ink);
      color:#fff;
      box-shadow:0 5px 0 rgba(23,23,22,.13);
    }

    .upload-btn:hover{
      background:#30302e;
      box-shadow:0 7px 14px rgba(23,23,22,.15);
      transform:translateY(-1px);
    }

    .upload-btn:active{
      box-shadow:0 2px 0 rgba(23,23,22,.13);
      transform:translateY(2px);
    }

    .analyze-btn{
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.7);
      color:var(--ink);
    }

    .analyze-btn:not(:disabled):hover{
      border-color:var(--ink);
      background:var(--ink);
      box-shadow:0 7px 14px rgba(23,23,22,.13);
      color:#fff;
      transform:translateY(-1px);
    }

    .analyze-btn:not(:disabled):active{transform:translateY(1px)}

    .analyze-btn:disabled{
      border-color:var(--line);
      background:rgba(255,255,255,.46);
      color:rgba(23,23,22,.38);
      cursor:not-allowed;
    }

    .arrow{
      display:flex;
      align-items:center;
      justify-content:center;
      height:50px;
      color:var(--muted);
      line-height:1;
      text-align:center;
      white-space:nowrap;
    }

    .arrow-dots{
      position:relative;
      display:block;
      width:39px;
      height:1px;
      margin:0;
      background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 6px);
    }

    .arrow-symbol{
      position:relative;
      display:block;
      width:15px;
      height:15px;
      margin-left:5px;
      font-size:0;
    }

    .arrow-symbol::before{
      position:absolute;
      top:50%;
      left:0;
      width:14px;
      height:1px;
      background:currentColor;
      content:"";
      transform:translateY(-50%);
    }

    .arrow-symbol::after{
      position:absolute;
      top:50%;
      right:0;
      width:5px;
      height:5px;
      border-top:1px solid currentColor;
      border-right:1px solid currentColor;
      content:"";
      transform:translateY(-50%) rotate(45deg);
    }

    .file-name{
      display:flex;
      min-height:40px;
      align-items:center;
      justify-content:center;
      gap:9px;
      margin:20px 0 0;
      color:var(--muted);
      font-size:13px;
      font-weight:500;
      word-break:break-word;
    }

    .file-icon{
      display:block;
      width:14px;
      height:16px;
      flex:0 0 14px;
      border:1px solid var(--line-strong);
      border-radius:2px;
      background:
        linear-gradient(135deg,transparent 0 57%,var(--line-strong) 58% 60%,transparent 61%) top right/5px 5px no-repeat,
        repeating-linear-gradient(45deg,transparent 0,transparent 2px,rgba(23,23,22,.22) 2px,rgba(23,23,22,.22) 3px);
    }

    .preview{
      display:none;
      width:min(84%,640px);
      margin:20px auto 0;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.82);
      box-shadow:0 9px 24px rgba(23,23,22,.04);
    }

    .preview-meta{
      display:flex;
      min-height:62px;
      align-items:center;
      gap:11px;
      padding:10px 12px;
      color:var(--muted-strong);
      font-size:13px;
      font-weight:600;
    }

    .preview-meta img{
      display:block;
      width:42px;
      height:42px;
      flex:0 0 42px;
      border:1px solid var(--line);
      border-radius:7px;
      background:var(--soft);
      object-fit:cover;
    }

    .preview-filename{
      min-width:0;
      flex:1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .preview-kind{
      padding:4px 7px;
      border:1px solid var(--line);
      border-radius:999px;
      color:var(--muted);
      font-family:"DM Mono",monospace;
      font-size:10px;
      letter-spacing:.02em;
      text-transform:uppercase;
    }

    .status{
      min-height:20px;
      margin-top:20px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      line-height:1.5;
      text-align:center;
    }

    .status[data-state="ready"]{color:var(--real)}
    .status[data-state="error"]{color:#bb4026}
    .status[data-state="pending"]{color:var(--uncertain)}

    .result{
      position:relative;
      display:grid;
      justify-items:center;
      margin-top:39px;
      padding:30px 20px 27px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(255,255,255,.74);
      box-shadow:var(--shadow);
      text-align:center;
    }

    .result::before{
      content:"MODEL ESTIMATE";
      margin-bottom:12px;
      color:var(--muted);
      font-family:"DM Mono",monospace;
      font-size:10px;
      font-weight:500;
      letter-spacing:.08em;
    }

    .result::after{
      position:absolute;
      right:auto;
      bottom:0;
      left:0;
      width:var(--confidence,0%);
      max-width:100%;
      height:3px;
      content:"";
      background:var(--result-color,var(--ink));
      transition:width .45s cubic-bezier(.2,.72,.22,1);
    }

    .result[data-status="ai-generated"]{
      --result-color:var(--accent);
      border-color:rgba(235,91,56,.25);
      background:linear-gradient(135deg,var(--accent-soft),rgba(255,255,255,.86));
    }

    .result[data-status="likely-real"]{
      --result-color:var(--real);
      border-color:rgba(38,118,95,.22);
      background:linear-gradient(135deg,var(--real-soft),rgba(255,255,255,.86));
    }

    .result[data-status="uncertain"]{
      --result-color:var(--uncertain);
      border-color:rgba(154,104,26,.22);
      background:linear-gradient(135deg,var(--uncertain-soft),rgba(255,255,255,.86));
    }

    .result[data-status="error"]{--result-color:#bb4026}

    .result-label{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      color:var(--ink);
      font-family:"Space Grotesk","Manrope",sans-serif;
      font-size:clamp(25px,4vw,32px);
      font-weight:600;
      letter-spacing:-.055em;
      line-height:1.1;
    }

    .result-label::before{
      width:8px;
      height:8px;
      flex:0 0 8px;
      border-radius:50%;
      background:var(--result-color,var(--ink));
      box-shadow:0 0 0 4px color-mix(in srgb,var(--result-color,var(--ink)) 12%,transparent);
      content:"";
    }

    .score{
      margin-top:10px;
      color:var(--muted-strong);
      font-family:"DM Mono",monospace;
      font-size:12px;
      font-weight:500;
      letter-spacing:.015em;
    }

    @media(min-width:601px){
      .page.guide-open{transform:translateX(165px)}
    }

    @media(max-width:600px){
      .menu-btn{top:16px;left:16px}
      .page{padding:82px 16px 32px}
      .hero h1{letter-spacing:-.075em}
      .analyzer{margin-top:49px}

      .upload-area{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:10px;
      }

      .upload-btn,.analyze-btn{
        width:auto;
        min-width:190px;
        padding:0 20px;
      }

      .arrow{
        flex-direction:column;
        height:23px;
      }

      .arrow-dots{display:none}

      .arrow-symbol{
        margin:0;
        transform:rotate(90deg);
      }

      .file-name{
        width:100%;
        justify-content:center;
        text-align:center;
      }

      .preview{width:100%;margin-top:18px}
      .result{padding-right:16px;padding-left:16px}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Open guide" aria-controls="sidePanel" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="menu-scrim" id="menuScrim" aria-hidden="true"></div>

  <aside class="side-panel" id="sidePanel" aria-hidden="true" aria-label="How AIorNot works">
    <h2>How it works</h2>
    <p>Upload an image.</p>
    <p>AIorNot analyzes it with an image classification model.</p>
    <p>It estimates whether the image is likely real or synthetic.</p>

    <h2 class="next-title">What’s next?</h2>
    <p>Video and audio analysis are being added.</p>
  </aside>

  <main class="page" id="mainContent">
    <section class="hero">
      <h1>AIorNot</h1>
      <p>Real or rendered? Let’s see.</p>
    </section>

    <section class="analyzer" aria-label="Image analyzer">
      <input
        id="fileInput"
        type="file"
        hidden
        accept=".jpg,.jpeg,.png,.webp,.mp4,.mov,.avi,.mkv,.webm,.mp3,.wav"
      >

      <div class="upload-area">
        <button class="upload-btn" id="uploadBtn" type="button">Choose file</button>
        <div class="arrow" aria-hidden="true"><span class="arrow-dots"></span><span class="arrow-symbol">→</span></div>
        <button class="analyze-btn" id="analyzeBtn" type="button" disabled>Analyze</button>
      </div>

      <div class="file-name" id="fileName">No file selected</div>
      <div class="preview" id="preview"></div>
      <div class="status" id="status" aria-live="polite" role="status"></div>

      <div class="result" id="result" hidden aria-live="polite">
        <div class="result-label" id="resultLabel"></div>
        <div class="score" id="resultScore"></div>
      </div>
    </section>
  </main>

  <script>
    const fileInput=document.getElementById('fileInput');
    const uploadBtn=document.getElementById('uploadBtn');
    const analyzeBtn=document.getElementById('analyzeBtn');
    const fileName=document.getElementById('fileName');
    const preview=document.getElementById('preview');
    const statusEl=document.getElementById('status');
    const result=document.getElementById('result');
    const resultLabel=document.getElementById('resultLabel');
    const resultScore=document.getElementById('resultScore');
    const menuBtn=document.getElementById('menuBtn');
    const menuScrim=document.getElementById('menuScrim');
    const sidePanel=document.getElementById('sidePanel');
    const page=document.querySelector('.page');
    let uploaded=null;
    let previewUrl=null;

    function setMenuOpen(isOpen){
      sidePanel.classList.toggle('open',isOpen);
      sidePanel.setAttribute('aria-hidden',String(!isOpen));
      menuBtn.setAttribute('aria-expanded',String(isOpen));
      menuBtn.setAttribute('aria-label',isOpen?'Close guide':'Open guide');
      page.classList.toggle('guide-open',isOpen);
      document.body.classList.toggle('menu-open',isOpen);
      menuBtn.focus();
    }

    menuBtn.addEventListener('click',()=>setMenuOpen(!sidePanel.classList.contains('open')));
    menuScrim.addEventListener('click',()=>setMenuOpen(false));
    document.addEventListener('keydown',(event)=>{
      if(event.key==='Escape'&&sidePanel.classList.contains('open')) setMenuOpen(false);
    });

    uploadBtn.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',()=>chooseFile(fileInput.files[0]));

    function fmt(bytes){
      if(bytes<1024)return bytes+' B';
      if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
      return (bytes/1024/1024).toFixed(1)+' MB';
    }

    function ext(name){
      return name.includes('.')?name.split('.').pop().toLowerCase():'';
    }

    function setStatus(message,state=''){
      statusEl.textContent=message;
      if(state) statusEl.dataset.state=state;
      else delete statusEl.dataset.state;
    }

    function setFileName(name,size){
      fileName.innerHTML='';
      const icon=document.createElement('span');
      icon.className='file-icon';
      icon.setAttribute('aria-hidden','true');
      const label=document.createElement('span');
      label.textContent=name+' • '+fmt(size);
      label.style.cssText='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      fileName.append(icon,label);
    }

    function resetPreview(){
      if(previewUrl){
        URL.revokeObjectURL(previewUrl);
        previewUrl=null;
      }
      preview.style.display='none';
      preview.innerHTML='';
    }

    function chooseFile(file){
      if(!file)return;

      uploaded=null;
      analyzeBtn.disabled=true;
      result.hidden=true;
      result.dataset.status='';
      result.style.removeProperty('--confidence');
      resultLabel.textContent='';
      resultScore.textContent='';
      setStatus('');
      resetPreview();
      setFileName(file.name,file.size);

      const extension=ext(file.name);
      if(['jpg','jpeg','png','webp'].includes(extension)){
        previewUrl=URL.createObjectURL(file);
        const img=document.createElement('img');
        img.src=previewUrl;
        img.alt='Preview of uploaded image';

        const meta=document.createElement('div');
        meta.className='preview-meta';
        const filename=document.createElement('span');
        filename.className='preview-filename';
        filename.textContent=file.name;
        const kind=document.createElement('span');
        kind.className='preview-kind';
        kind.textContent='Image';

        meta.append(img,filename,kind);
        preview.append(meta);
        preview.style.display='block';
      }

      upload(file);
    }

    async function upload(file){
      setStatus('Uploading…','pending');
      const fd=new FormData();
      fd.append('media',file);

      try{
        const response=await fetch('/api/upload',{method:'POST',body:fd});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'Upload failed.');

        uploaded=data;
        setFileName(data.filename,data.size);
        if(data.kind==='image'){
          analyzeBtn.disabled=false;
          setStatus('Ready to analyze.','ready');
        }else{
          analyzeBtn.disabled=true;
          setStatus('Analysis coming soon — image analysis is available now; video and audio analysis are being added.','pending');
        }
      }catch(error){
        setStatus(error.message,'error');
      }
    }

    function presentationFor(data){
      if(data.status==='AI-GENERATED') return {label:'Likely AI-generated',status:'ai-generated'};
      if(data.status==='LIKELY_REAL') return {label:'Likely real',status:'likely-real'};
      if(data.status==='UNCERTAIN') return {label:'Analysis inconclusive',status:'uncertain'};
      return {label:data.label||'Result',status:'neutral'};
    }

    function probabilityText(value){
      const probability=Number(value);
      if(!Number.isFinite(probability))return '';
      return Number.isInteger(probability)?String(probability):probability.toFixed(1);
    }

    function renderResult(data){
      const presentation=presentationFor(data);
      const score=Number(data.score);
      const hasScore=Number.isFinite(score);
      const fakeProbability=probabilityText(data.fake_probability);
      const realProbability=probabilityText(data.real_probability);
      let scoreText='';

      if(presentation.status==='ai-generated'&&hasScore){
        scoreText=`${Math.round(score)}% AI-generated model score`;
      }else if(presentation.status==='likely-real'&&hasScore){
        scoreText=`${Math.round(score)}% real model score`;
      }else if(presentation.status==='uncertain'&&fakeProbability&&realProbability){
        scoreText=`Mixed signals: ${fakeProbability}% AI · ${realProbability}% real`;
      }else if(hasScore){
        scoreText=`${Math.round(score)}% model score`;
      }

      result.hidden=false;
      result.dataset.status=presentation.status;
      result.style.setProperty('--confidence',hasScore?`${Math.min(100,Math.max(0,score))}%`:'0%');
      resultLabel.textContent=presentation.label;
      resultScore.textContent=scoreText;
      resultScore.title='This is a model estimate, not a guarantee of authenticity.';
    }

    analyzeBtn.addEventListener('click',async()=>{
      if(!uploaded)return;
      analyzeBtn.disabled=true;
      fileInput.disabled=true;
      setStatus('Analyzing…','pending');

      const fd=new FormData();
      fd.append('stored_name',uploaded.stored_name);
      fd.append('filename',uploaded.filename);

      try{
        const response=await fetch('/api/analyze',{method:'POST',body:fd});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'Analysis failed.');

        renderResult(data);
        setStatus('');
      }catch(error){
        result.hidden=false;
        result.dataset.status='error';
        result.style.setProperty('--confidence','0%');
        resultLabel.textContent='Analysis unavailable';
        resultScore.textContent='';
        setStatus(error.message,'error');
      }finally{
        analyzeBtn.disabled=false;
        fileInput.disabled=false;
      }
    });

    window.addEventListener('beforeunload',resetPreview);
  </script>
